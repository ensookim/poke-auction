spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/poke_auction
    username: poke_user
    password: poke_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

server:
  port: 8080

app:
  mobile-redirect-url: ${APP_MOBILE_REDIRECT_URL:exp://localhost:8081/--/login-success}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  payment-success-url: ${APP_PAYMENT_SUCCESS_URL:cardbid://payment-success}
  payment-fail-url: ${APP_PAYMENT_FAIL_URL:cardbid://payment-fail}

kakao:
  client-id: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 3600
  refresh-token-expiration: 604800

toss:
  client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
